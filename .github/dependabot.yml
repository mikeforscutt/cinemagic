version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      php-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      js-dependencies:
        patterns: ['*']